name: Check In
on:
  workflow_dispatch:
jobs:
  check-in:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset trial by deleting workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "正在清理历史运行记录，以重置 7 天试用期..."
          gh run list --workflow "crawler.yml" --json databaseId --jq '.[].databaseId' | while read id; do
            gh run delete "$id" || true
          done
          echo "✅ 签到成功，试用期已重置。"
